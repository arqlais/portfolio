chamada: v-ray × ia
titulo: arraste para *comparar*
texto: domino os dois fluxos de renderização — fotorrealismo tradicional em V-Ray e renderização com inteligência artificial. nas imagens abaixo, arraste o marcador pra ver o print simples ao lado do resultado final com IA.
vray_texto: "renderização tradicional: cada material, luz e sombra é calculado do zero, com controle total sobre cada detalhe da cena."
ia_texto: "renderização com inteligência artificial: parte de uma imagem-base e gera resultados rápidos, com uma estética mais livre."
