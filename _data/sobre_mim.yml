chamada: sobre mim
titulo: um *método próprio*, construído com experiência
texto: sou estudante de Arquitetura e Urbanismo, no 9º período, e tenho experiência anterior na área de design — um diferencial que aparece na organização visual, na apresentação, na composição e no cuidado com cada entrega. ao longo do caminho, fiz dezenas de cursos de renderização, modelagem e detalhamento, unindo o fotorrealismo tradicional com as novas ferramentas de IA.
