titulo: "Do papel às *chaves:*\no seu lar pensado\nem cada detalhe."
texto: "Apartamentos compactos pedem decisões certeiras: cada móvel, tomada e armário conta. Com um projeto, você **vê o seu ap pronto antes de gastar**, compra com segurança e entra na reforma sabendo o que vai acontecer."
imagem_destaque: "/assets/img/gallery/g13.jpg"
imagem_legenda: "projeto real · laís"
foto: "/assets/img/perfil-alta.jpg"
carta: "Oi! Sou a **Laís**, estudante de Arquitetura no 9º período e designer 3D. Comprei meu ap aqui também, então sei bem como é essa fase: a ansiedade pela entrega das chaves, a planta impressa na mão, mil ideias salvas no Pinterest e a dúvida se o sofá vai caber. Montei esta proposta com **carinho e preço de vizinha**, pra gente transformar esse espaço em casa de verdade, sem pressa e sem surpresa."
carta_assinatura: "com carinho, laís"
transparencia_rotulo: "transparência"
transparencia_texto: "Ainda não sou formada, por isso trabalho em **parceria com meu pai, Rogério, engenheiro civil** registrado no CREA. Quando a reforma precisa de documentação, ele é o responsável técnico (plano de reforma e ART) e também faz **vistorias**, contratados à parte. Eu cuido do projeto, das imagens e do detalhamento."
motivos_chamada: "antes de quebrar a primeira parede"
motivos_titulo: "por que fazer o projeto *antes* da reforma?"
motivos:
  - titulo: "Você vê antes de comprar"
    texto: "Imagens 3D do seu ap mobiliado evitam o móvel que não cabe e a cor que não combina. Você aprova tudo antes de gastar."
  - titulo: "Cada centímetro rende"
    texto: "Em plantas compactas, layout inteligente e marcenaria sob medida transformam canto perdido em armário, nicho e bancada."
  - titulo: "Menos retrabalho, menos gasto"
    texto: "Tomadas, luz e armários decididos no papel. Na obra, menos improviso e menos coisa para refazer."
  - titulo: "Reforma tranquila no condomínio"
    texto: "O condomínio exige plano de reforma com responsável técnico. Com o engenheiro parceiro, isso pode ser resolvido junto com o projeto."
ia_chamada: "um cuidado importante"
ia_titulo: "IA faz imagem bonita. Não faz *projeto.*"
ia_texto: "Hoje dá pra gerar o \"ap dos sonhos\" em segundos, e eu mesma uso IA como ferramenta de imagem. Mas uma foto gerada **não conhece a sua planta**: ela inventa medidas, encaixa móveis que não cabem e não diz ao marceneiro nem ao eletricista o que fazer."
ia_ruim_titulo: "imagem gerada por IA"
ia_ruim:
  - texto: "Medidas inventadas, fora da escala real do ap"
  - texto: "Móveis e janelas que não existem na sua planta"
  - texto: "Nenhuma tomada, ponto de luz ou detalhe de marcenaria"
  - texto: "Não serve para orçar, executar nem aprovar no condomínio"
ia_bom_titulo: "projeto de verdade"
ia_bom:
