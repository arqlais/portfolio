letras_miudas: "Valores para apartamentos de 38 a 40m², válidos para contratações até 30/06/2027. Prazos definidos no contrato, conforme o pacote. Todos os pacotes são desenvolvidos com as medidas da planta fornecida pela construtora; as medidas devem ser conferidas no local antes da execução (pelo profissional da obra ou com a medição no ap, contratada à parte). Uma rodada de ajustes é uma lista única de alterações enviada de uma vez após cada entrega; rodadas extras, novas opções de layout ou ambientes extras são orçados à parte. Imagens 3D são ilustrativas: cores e acabamentos podem variar nos produtos reais. Pacotes fechados: itens não utilizados não geram desconto. Não incluem alteração de estrutura, hidráulica ou circuitos elétricos, nem serviços com o engenheiro, orçados à parte. Descontos não cumulativos, exceto a indicação, com desconto total máximo de 15%. O desconto por indicação é aplicado em parcela pendente ou como crédito em serviço futuro, nunca devolvido em dinheiro. Parcelamento no cartão com acréscimo das taxas da operadora."
final_titulo: "vamos tirar o seu ap do *papel?*"
final_texto: "Me chama no WhatsApp, sem compromisso, que eu tiro suas dúvidas e monto o orçamento do seu ap. Ou aponte a câmera para o código."
final_mensagem: "Oi Laís! Vi sua proposta para os moradores e quero saber mais :)"
