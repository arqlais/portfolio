    Atuo com terceirização de modelagem 3D, renderização, detalhamento e projeto executivo, atendendo arquitetos, designers e construtoras. Meu foco é entregar imagens e materiais técnicos que comuniquem com clareza, qualidade e sensibilidade cada projeto.
