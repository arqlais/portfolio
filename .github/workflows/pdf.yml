# Gera de novo o portfólio em PDF sempre que o conteúdo do site muda (por exemplo,
# ao salvar no painel /admin) e publica o arquivo em assets/pdf/.
name: Gerar portfólio em PDF

on:
  push:
    branches: [main]
    paths:
      - "_data/**"
      - "_includes/**"
      - "assets/img/**"
      - "assets/css/pdf.css"
      - "portfolio-pdf.html"
      - "ferramentas/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pdf.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: gerar-pdf
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar ferramentas
        run: |
          gem install jekyll -v 4.4.1 --no-document
          npm ci
          npx playwright install --with-deps chromium

      - name: Montar o site
        run: jekyll build

      - name: Gerar o PDF
        run: |
          node ferramentas/gerar-pdf.mjs _site assets/pdf/portfolio-lais-vieira.pdf
          echo "{\"gerado\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > assets/pdf/info.json

      - name: Publicar o PDF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pdf/portfolio-lais-vieira.pdf assets/pdf/info.json
          if git diff --cached --quiet; then echo "PDF sem mudanças."; exit 0; fi
          git commit -m "Atualiza o portfólio em PDF"
          for tentativa in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
          # Envios feitos pela automação não disparam o GitHub Pages sozinhos: pede a publicação.
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
