# Painel de edição do site (Pages CMS — https://app.pagescms.org).
# Entre com sua conta do GitHub, escolha o repositório "portfolio" e edite
# textos e imagens. Cada "Salvar" vira um commit e o site se atualiza sozinho.

media:
  input: assets/img
  output: /assets/img
  categories: [image]

components:
  selo:
    type: object
    fields:
      - name: icone
        label: Ícone
        type: select
        options:
          values: [formatura, medalha, maleta, alvo, imagem, cubo, lapis, prancheta, mapa, prancha]
      - { name: titulo, label: Título, type: string }
      - { name: texto, label: Texto, type: string }

content:
  - name: geral
    label: Geral e contato
    type: file
    path: _data/geral.yml
    fields:
      - { name: titulo_pagina, label: Título da aba do navegador, type: string }
      - { name: descricao_pagina, label: Descrição para o Google, type: text }
      - { name: marca, label: Logo (texto), type: string }
      - { name: nome, label: Nome completo, type: string }
      - { name: whatsapp_numero, label: "WhatsApp (só números, com 55 e DDD)", type: string, description: "Ex.: 5511969288192" }
      - { name: whatsapp_exibicao, label: WhatsApp (como aparece no rodapé), type: string }
      - { name: email, label: E-mail, type: string }
      - { name: instagram_usuario, label: Instagram (sem @), type: string }
      - { name: rodape_descricao, label: Descrição no rodapé, type: text }
      - { name: rodape_servicos, label: Linha final do rodapé, type: string }

  - name: inicio
    label: Início (topo do site)
    type: file
    path: _data/inicio.yml
    fields:
      - { name: foto, label: Foto de perfil, type: image, options: { path: assets/img } }
      - { name: foto_alt, label: Descrição da foto (acessibilidade), type: string }
      - { name: chamada_topo, label: Chamada no topo, type: string }
      - { name: ano, label: Ano, type: string }
      - { name: saudacao, label: Saudação (letra cursiva), type: string }
      - { name: apresentacao, label: Apresentação, type: rich-text, description: "Use negrito para destacar palavras." }
      - name: selos
        label: Selos
        component: selo
        list: true
      - { name: botao_portfolio, label: Botão "ver portfólio", type: string }
      - { name: botao_whatsapp, label: Botão do WhatsApp, type: string }
      - { name: faixa_rolante, label: Faixa rolante (palavras), type: string, list: true }
      - name: numeros
        label: Números
        type: object
        list: true
        fields:
          - { name: numero, label: Número, type: number }
          - { name: sufixo, label: Sufixo (ex. +), type: string }
          - { name: legenda, label: Legenda, type: string }
      - { name: destaque_frase, label: Faixa escura — frase cursiva, type: string }
      - { name: destaque_titulo, label: Faixa escura — título, type: string }
      - { name: destaque_texto, label: Faixa escura — texto, type: text }

  - name: para_quem
    label: Para quem
    type: file
    path: _data/para_quem.yml
    fields:
      - { name: chamada, label: Chamada, type: string }
      - { name: titulo, label: Título, type: string, description: "Coloque *entre asteriscos* o trecho em letra cursiva." }
      - name: publicos
        label: Públicos (abas)
        type: object
        list: true
        fields:
          - { name: botao, label: Texto do botão, type: string }
          - { name: etiqueta, label: Etiqueta, type: string }
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: text }
          - { name: itens, label: Itens da lista, type: string, list: true }

  - name: servicos
    label: Serviços e softwares
    type: file
    path: _data/servicos.yml
    fields:
      - { name: chamada, label: Chamada, type: string }
      - { name: titulo, label: Título, type: string, description: "Coloque *entre asteriscos* o trecho em letra cursiva." }
      - { name: texto, label: Texto, type: text }
      - name: servicos
        label: Serviços
        type: object
        list: true
        fields:
          - name: icone
            label: Ícone
            type: select
            options:
              values: [imagem, cubo, lapis, prancheta, mapa, prancha, formatura, medalha, maleta, alvo]
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: text }
      - { name: botao, label: Texto do botão de orçamento, type: string }
      - { name: mensagem_whatsapp, label: Mensagem pronta do WhatsApp, type: string }
      - { name: softwares_chamada, label: Softwares — chamada, type: string }
      - { name: softwares_titulo, label: Softwares — título, type: string, description: "Coloque *entre asteriscos* o trecho em letra cursiva." }
      - { name: softwares_texto, label: Softwares — texto, type: text }
      - { name: softwares, label: Softwares, type: string, list: true }

  - name: comparar
    label: Comparar (V-Ray × IA)
    type: file
    path: _data/comparar.yml
    fields:
      - { name: chamada, label: Chamada, type: string }
      - { name: titulo, label: Título, type: string, description: "Coloque *entre asteriscos* o trecho em letra cursiva." }
      - { name: texto, label: Texto, type: text }
      - { name: vray_texto, label: Texto V-Ray, type: text }
      - { name: ia_texto, label: Texto IA, type: text }
      - name: comparacoes
        label: Comparações (arrastar)
        type: object
        list: true
        fields:
          - { name: ambiente, label: Ambiente, type: string }
          - { name: descricao_alt, label: Descrição da imagem (acessibilidade), type: string }
          - { name: credito, label: Crédito, type: string }
          - { name: imagem_print, label: Imagem "print" (antes), type: image, options: { path: assets/img/compare } }
          - { name: imagem_ia, label: Imagem final com IA (depois), type: image, options: { path: assets/img/compare } }

  - name: portfolio
    label: Portfólio (galeria)
    type: file
    path: _data/portfolio.yml
    fields:
      - { name: chamada, label: Chamada, type: string }
      - { name: titulo, label: Título, type: string, description: "Coloque *entre asteriscos* o trecho em letra cursiva." }
      - { name: texto, label: Texto, type: text }
      - name: imagens
        label: Imagens
        type: object
        list: true
        fields:
          - { name: imagem, label: Imagem, type: image, options: { path: assets/img/gallery } }
          - { name: projeto, label: Projeto / cliente, type: string }
          - name: tipo
            label: Tipo de render
            type: select
            options:
              values:
                - { value: vray, label: V-Ray }
                - { value: ia, label: Renderização com IA }

  - name: projetos
    label: Estudos de caso
    type: file
    path: _data/projetos.yml
    fields:
      - { name: chamada, label: Chamada, type: string }
      - { name: titulo, label: Título, type: string, description: "Coloque *entre asteriscos* o trecho em letra cursiva." }
      - { name: texto, label: Texto, type: text }
      - name: projetos
        label: Projetos
        type: object
        list: true
        fields:
          - { name: imagem, label: Imagem, type: image, options: { path: assets/img/cases } }
          - { name: descricao_alt, label: Descrição da imagem (acessibilidade), type: string }
          - { name: legenda, label: Legenda ao ampliar, type: string }
          - { name: categoria, label: Categoria, type: string }
          - { name: titulo, label: Título, type: string, description: "Coloque *entre asteriscos* o trecho em letra cursiva." }
          - { name: texto, label: Texto, type: text }
          - name: ficha
            label: Ficha técnica
            type: object
            list: true
            fields:
              - { name: rotulo, label: Rótulo, type: string }
              - { name: valor, label: Valor, type: string }

  - name: como_funciona
    label: Como funciona
    type: file
    path: _data/como_funciona.yml
    fields:
      - { name: chamada, label: Chamada, type: string }
      - { name: titulo, label: Título, type: string, description: "Coloque *entre asteriscos* o trecho em letra cursiva." }
      - { name: texto, label: Texto, type: text }
      - name: etapas
        label: Etapas
        type: object
        list: true
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: text }

  - name: sobre_mim
    label: Sobre mim
    type: file
    path: _data/sobre_mim.yml
    fields:
      - { name: chamada, label: Chamada, type: string }
      - { name: titulo, label: Título, type: string, description: "Coloque *entre asteriscos* o trecho em letra cursiva." }
      - { name: texto, label: Texto, type: text }
      - name: selos
        label: Selos
        component: selo
        list: true

  - name: contato
    label: Chamada final
    type: file
    path: _data/contato.yml
    fields:
      - { name: frase, label: Frase cursiva, type: string }
      - { name: titulo, label: Título, type: string }
      - { name: texto, label: Texto, type: text }
      - { name: botao_orcamento, label: Botão de orçamento, type: string }
      - { name: botao_email, label: Botão de e-mail, type: string }
